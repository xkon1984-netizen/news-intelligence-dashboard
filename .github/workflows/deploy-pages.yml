name: Deploy Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'data/news.json'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          cp dashboard/style.css _site/style.css
          cp dashboard/app.js _site/app.js
          cp data/news.json _site/data/news.json
          if [ -f dashboard/data/transfer_sources.json ]; then
            cp dashboard/data/transfer_sources.json _site/data/transfer_sources.json
          fi
          touch _site/.nojekyll

      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Publish dashboard"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
